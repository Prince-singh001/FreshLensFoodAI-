services:
  - type: web
    name: foodlens-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --config backend/gunicorn.conf.py backend.app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: USE_TFLITE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
