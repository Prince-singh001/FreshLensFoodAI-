<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 44" width="204" height="44" fill="none">
  <defs>
    <linearGradient id="logoGreenGrad" x1="10" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16845B"/>
      <stop offset="100%" stop-color="#105C43"/>
    </linearGradient>
    <linearGradient id="logoScanGrad" x1="8" y1="22" x2="34" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20B8A5" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#20B8A5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#20B8A5" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Group: Symbol (40x40 scale) -->
  <g transform="translate(2, 2)">
    <!-- Brackets -->
    <path d="M5 12V8C5 6.34 6.34 5 8 5H12" stroke="#20B8A5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 5H32C33.66 5 35 6.34 35 8V12" stroke="#20B8A5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M5 28V32C5 33.66 6.34 35 8 35H12" stroke="#20B8A5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 35H32C33.66 35 35 33.66 35 32V28" stroke="#20B8A5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Lens Ring -->
    <circle cx="20" cy="20" r="14" stroke="#16845B" stroke-width="1.3" stroke-dasharray="3 2" opacity="0.35"/>

    <!-- Food produce silhouette -->
    <path d="M20 14.5C17.5 13.2 12 14.5 12 20.5C12 26.5 16.5 30 20 30C23.5 30 28 26.5 28 20.5C28 14.5 22.5 13.2 20 14.5Z" fill="url(#logoGreenGrad)"/>

    <!-- Fresh Leaf -->
    <path d="M20 14C20.5 10 24.2 8 27.2 8.5C27.6 12 24.6 14.5 20 14Z" fill="#20B8A5"/>

    <!-- Scan Beam -->
    <line x1="8" y1="21.5" x2="32" y2="21.5" stroke="url(#logoScanGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="21.5" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Wordmark: FoodLens -->
  <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em" fill="#105C43">Food<tspan fill="#16845B">Lens</tspan></text>

  <!-- AI Badge -->
  <rect x="156" y="11" width="42" height="22" rx="6" fill="#20B8A5"/>
  <text x="177" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">AI</text>
</svg>
